name: Entra Secret Expiry Check

# Manual-only until repo secrets AZURE_CREDENTIALS and TEAMS_WEBHOOK_URL are added.
# After secrets are added, uncomment the schedule block below to enable weekly runs.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 8 * * 1'   # Monday 08:00 UTC

permissions:
  contents: read
  id-token: write   # for federated Azure login if used

env:
  ENTRA_APP_ID: 79da6be7-9ea8-4e39-8edc-6863da932f2b
  ALERT_THRESHOLD_DAYS: "30"

jobs:
  check-expiry:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Check days until Entra secret expiry
        id: check
        run: |
          set -euo pipefail
          EXPIRY=$(az ad app credential list \
            --id "$ENTRA_APP_ID" \
            --query "[0].endDateTime" -o tsv)

          if [ -z "$EXPIRY" ] || [ "$EXPIRY" = "null" ]; then
            echo "ERROR: could not read endDateTime for app $ENTRA_APP_ID" >&2
            exit 1
          fi

          DAYS=$(( ($(date -d "$EXPIRY" +%s) - $(date +%s)) / 86400 ))
          echo "Entra secret expires in $DAYS days (on $EXPIRY)"
          {
            echo "days=$DAYS"
            echo "expiry=$EXPIRY"
            if [ "$DAYS" -lt "$ALERT_THRESHOLD_DAYS" ]; then
              echo "alert=true"
            else
              echo "alert=false"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Post Teams alert if expiry < threshold
        if: steps.check.outputs.alert == 'true'
        env:
          WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          DAYS_LEFT: ${{ steps.check.outputs.days }}
          EXPIRY_DATE: ${{ steps.check.outputs.expiry }}
        run: |
          set -euo pipefail
          PAYLOAD=$(jq -n \
            --arg days "$DAYS_LEFT" \
            --arg expiry "$EXPIRY_DATE" \
            '{text: ("⚠️ Zendesk MCP — Entra client secret expires in " + $days + " days (on " + $expiry + "). Rotate via Key Vault before expiry to avoid auth outage. Runbook: docs/INCIDENT-RESPONSE.md")}')
          curl -sS -H "Content-Type: application/json" -d "$PAYLOAD" "$WEBHOOK_URL"

      - name: Fail the run if expiry < threshold
        if: steps.check.outputs.alert == 'true'
        env:
          DAYS_LEFT: ${{ steps.check.outputs.days }}
        run: |
          echo "::error::Entra secret expires in ${DAYS_LEFT} days — rotation required"
          exit 1
