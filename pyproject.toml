[project]
name = "zendesk-mcp-server"
version = "2.0.0"
description = "MCP Server for Zendesk API - Tickets & Articles (read/create/update only, no delete operations)"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.20.0",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "starlette>=0.40",
    "python-dotenv>=1.0",
]

[project.scripts]
zendesk-mcp = "src.main:main"

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
target-version = ["py311"]
line-length = 120

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.pylint.format]
max-line-length = 120
